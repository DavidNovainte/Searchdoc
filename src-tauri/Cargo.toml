[package]
name = "searchdoc"
version = "0.1.0"
description = "Local-first deep text search across local files and Google Docs"
authors = ["SearchDoc"]
edition = "2021"

[lib]
name = "searchdoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5.0"
rayon = "1"
notify = "7"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
uuid = { version = "1.24.0", features = ["v4"] }
keyring = { version = "4.1.6", features = ["v1"] }
chrono = "0.4.45"
thiserror = "2.0.19"
directories = "6.0.0"
once_cell = "1.21.4"
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.13.4", features = ["blocking", "form", "json", "rustls"] }
url = "2.5.8"
base64 = "0.23.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
urlencoding = "2.1.3"
pdf-extract = "0.12.0"
docx-rs = "0.4.22"
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
